name: Publish packages

on:
  push:
    branches:
      - main
    paths:
      - "packages/*/package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  portable:
    name: Portable CLI (${{ matrix.os }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm bundle:cli
      - uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.os }}
          path: packages/cli/dist-archives/*.zip
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository and package tarballs
        run: pnpm check

      - name: Download verified portable CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          path: portable-archives
          merge-multiple: true

      - name: Configure release Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish unpublished package versions
        run: pnpm release

      - name: Push release tags
        run: git push origin --tags

      # Attach assets only to a CLI release created from this source revision.
      - name: Attach portable CLI archives to their release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          tag="consultchimps@${version}"
          tag_commit="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [ -n "${tag_commit}" ] && [ "${tag_commit}" = "$(git rev-parse HEAD)" ]; then
            gh release create "${tag}" --verify-tag --title "${tag}" \
              --notes "Portable CLI: download the archive matching your operating system and architecture, extract it, and run \`node consultchimps.mjs --help\` on Node.js 24. Keep its node_modules directory beside the executable. No npm access is required on the destination machine. Changelog: https://github.com/consultchimps/consultchimps/blob/main/packages/cli/CHANGELOG.md" \
              || true
            gh release upload "${tag}" portable-archives/*.zip --clobber
          else
            echo "No CLI release was published from this commit; skipping the bundle upload."
          fi

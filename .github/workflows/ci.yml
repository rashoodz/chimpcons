name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The Node 24 legs run the full verification sequence (the development
  # toolchain targets Node 24). The extra Node lines validate the published
  # runtime contract (engines.node >=22.0.0) by building and running the
  # test suites only: 22.16 is the declared floor, latest 22 tracks that
  # line, and 26 catches breakage on the next line early. Drop the 22 legs
  # around Node 22's April 2027 end of life.
  verify:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        checks: [full]
        include:
          - os: ubuntu-latest
            node: "22.16"
            checks: runtime
          - os: ubuntu-latest
            node: "22"
            checks: runtime
          - os: ubuntu-latest
            node: "26"
            checks: runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, build, types, and tests
        if: matrix.checks == 'full'
        run: pnpm check

      - name: Build and verify the portable CLI archive
        if: matrix.checks == 'full'
        run: pnpm bundle:cli

      - name: Build and run the test suites on this Node line
        if: matrix.checks == 'runtime'
        run: |
          pnpm --filter "./packages/*" build
          pnpm test:run

  # Browser smoke tests for the in-browser tool pages. They run against the
  # static export exactly as GitHub Pages serves it, so they need a real
  # browser and only run on Linux; the operations underneath are covered
  # cross-platform by the unit suites in `verify`.
  e2e:
    name: Browser tools
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        run: |
          manifest="apps/docs/node_modules/@playwright/test/package.json"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('${manifest}', 'utf8')).version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key:
            playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run:
          pnpm --filter @consultchimps/docs exec playwright install chromium
          --with-deps

      # Built without NEXT_PUBLIC_BASE_PATH so the export serves from "/",
      # which is what the suite's static server and the tests assume.
      - name: Build the documentation site and CLI for file interchange tests
        run:
          pnpm --filter @consultchimps/docs... --filter consultchimps... build

      - name: Run the browser smoke tests
        run: pnpm --filter @consultchimps/docs e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7

  # Aggregates the matrix and the browser suite into the single "Check" status
  # that branch protection requires; it fails unless every job passed.
  check:
    name: Check
    needs: [verify, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm every operating system passed
        run: test "${{ needs.verify.result }}" = "success"

      - name: Confirm the browser smoke tests passed
        run: test "${{ needs.e2e.result }}" = "success"
